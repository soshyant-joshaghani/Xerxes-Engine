<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!-- dx fills the title from Dioxus.toml [web.app] title. -->
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; }
    /* Shown while the wasm downloads and compiles; hidden once Bevy adds its canvas to the page. */
    .xerxes-loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center;
                      color: #c7ccd5; font: 500 15px system-ui, sans-serif; letter-spacing: 0.06em; }
    .xerxes-loading .bar { width: 160px; height: 3px; border-radius: 2px; background: #1f2430; overflow: hidden; }
    .xerxes-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #f2741f;
                                  animation: xerxes-slide 1.1s ease-in-out infinite; }
    @keyframes xerxes-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    body:has(canvas) .xerxes-loading { display: none; }
  </style>
</head>
<body>
  <div class="xerxes-loading">
    <span>Loading…</span>
    <div class="bar"></div>
  </div>
  <div id="main"></div>
</body>
</html>
