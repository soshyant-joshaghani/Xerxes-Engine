# Production — single VM (backend API + worker + Traefik + Postgres + Redis).
# Games (games/<name>) are built and shipped on their own; there is no web-client service here.
#
#   cp .env.example .env
#   __ctrl__/remote/start-prod.sh
#
# Stop:  __ctrl__/remote/stop-prod.sh
# Reset: __ctrl__/remote/reset-prod.sh  (wipe DB/Redis + app images; keeps ./letsencrypt/)
#
# 1. Set DOMAIN below (e.g. example.com) and x-prod-app-config URLs/CORS.
# 2. Point DNS A records at the VM public IP (CDN optional — origin is the VM):
#
#      Host          Type    Points to
#      ------------  ------  ---------
#      api           A       <VM IP>     → https://api.example.com (backend)
#      adminer       A       <VM IP>     → https://adminer.example.com (optional)
#
# Adminer login (prod): server `db`, port 5432, credentials from .env — not localhost.
#
# 3. docker network create traefik-public   (once per VM)
#
# The API applies backend/migrations on start.

name: xerxes

include:
  - compose.traefik.yml

x-backend-image: &backend-image
  image: xerxes-backend:prod

x-prod-app-config: &prod-app-config
  DOMAIN: example.com
  ENVIRONMENT: production
  PROJECT_NAME: xerxes
  # Which series of backend modules this container serves: all | api | multiplayer.
  # `all` today; see the note on a separate multiplayer service below.
  SERVICES: ${SERVICES:-all}
  # Origin of the browser client that calls the API (CORS); point it at where a game is served.
  FRONTEND_HOST: https://example.com
  BACKEND_CORS_ORIGINS: https://example.com,https://api.example.com
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  POSTGRES_SERVER: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB?Variable not set}
  POSTGRES_USER: ${POSTGRES_USER?Variable not set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  redis:
    image: redis:8-alpine
    restart: always
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --save 60 1 --loglevel warning
        fi
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      # postgres:18 VOLUME is /var/lib/postgresql (not .../data); default PGDATA is .../18/docker.
      # Mount the named volume at /var/lib/postgresql or Docker creates an empty anonymous volume.
      - db-data:/var/lib/postgresql
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.xerxes-adminer.loadbalancer.server.port=8080
      - traefik.http.routers.xerxes-adminer-http.rule=Host(`adminer.${DOMAIN:-example.com}`)
      - traefik.http.routers.xerxes-adminer-http.entrypoints=http
      - traefik.http.routers.xerxes-adminer-http.middlewares=https-redirect
      - traefik.http.routers.xerxes-adminer-https.rule=Host(`adminer.${DOMAIN:-example.com}`)
      - traefik.http.routers.xerxes-adminer-https.entrypoints=https
      - traefik.http.routers.xerxes-adminer-https.tls.certresolver=le

  backend:
    <<: *backend-image
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sole builder for xerxes-backend:prod (the worker reuses this tag).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.xerxes-backend.loadbalancer.server.port=8000
      - traefik.http.routers.xerxes-backend-http.rule=Host(`api.${DOMAIN:-example.com}`)
      - traefik.http.routers.xerxes-backend-http.entrypoints=http
      - traefik.http.routers.xerxes-backend-http.middlewares=https-redirect
      - traefik.http.routers.xerxes-backend-https.rule=Host(`api.${DOMAIN:-example.com}`)
      - traefik.http.routers.xerxes-backend-https.entrypoints=https
      - traefik.http.routers.xerxes-backend-https.tls.certresolver=le
    environment:
      <<: *prod-app-config

  worker:
    <<: *backend-image
    restart: always
    pull_policy: never
    # Image built by `backend` (shared tag). Duplicate build: races Bake export.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      <<: *prod-app-config
    command: ["/app/worker"]

  # Later, when WebSocket load calls for it, run multiplayer in its own container (same image, no
  # new build): set `SERVICES: api` on `backend`, add the service below, and give Traefik a
  # PathPrefix(`/multiplayer`) router for it (the API keeps Host(`api.<domain>`)).
  #
  # multiplayer:
  #   <<: *backend-image
  #   restart: always
  #   pull_policy: never
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     <<: *prod-app-config
  #     SERVICES: multiplayer

volumes:
  db-data:
  redis-data:

networks:
  traefik-public:
    name: traefik-public
    external: true
